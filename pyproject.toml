[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "makma"
version = "0.1.0"
description = "Local, persistent research agents with evidence-based experimentation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "starlette==1.8.0"]

[project.optional-dependencies]
world-stream = ["websockets>=15,<17"]
test = ["pytest==9.1.1", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["makma*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
